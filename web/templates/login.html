{% extends "base.html" %}
{% block title %}Login — Assault Fire Emulator{% endblock %}
{% block content %}
<div class="eyebrow">AF EMULATOR // ACCOUNT SERVICE</div>
<h1>Log in</h1>
<p class="lead">Players and administrators use this same login page.</p>
{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('login') }}" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" value="{{ entered_username }}" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button class="button" type="submit">Log in</button>
</form>
<p class="small"><a href="{{ url_for('recover') }}">Use a one-time recovery code</a></p>
{% endblock %}
