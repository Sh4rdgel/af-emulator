<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Assault Fire Emulator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">AF Emulator</a>
    <nav>
      <a href="{{ url_for('status') }}">Status</a>
      {% if g.user %}
        <a href="{{ url_for('account') }}">Account</a>
        {% if g.user.is_admin %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
        <form class="inline" method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="link-button" type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Log in</a>
        <a href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main class="shell">
    <section class="card {% block card_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
